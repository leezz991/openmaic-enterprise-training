name: Publish HealthAgent v0.6

on:
  push:
    branches:
      - health-agent-updates
    paths:
      - ".github/workflows/publish-health-agent-v06.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download V0.6 artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestus2.oaiusercontent.com/files/00000000-24c0-81f8-9179-a6355f65024c/raw?se=2026-10-07T09%3A02%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=6a3f01d9-9665-507c-ae5e-e82b2193c156&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T00%3A23%3A45Z&ske=2026-10-08T00%3A23%3A45Z&sks=b&skv=2026-02-06&sig=lctFzBiOvsUP%2BbCyw8e1SDN7rwva0g2GhoxY5UcC9qE%3D"
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip
          mv app-release.apk health-agent-updates/HealthAgent-v0.6.0.apk

      - name: Update manifest
        run: |
          SHA=$(sha256sum health-agent-updates/HealthAgent-v0.6.0.apk | awk '{print $1}')
          cat > health-agent-updates/latest.json <<EOF
          {
            "versionCode": 6,
            "versionName": "0.6.0",
            "apkUrl": "https://raw.githubusercontent.com/leezz991/openmaic-enterprise-training/health-agent-updates/health-agent-updates/HealthAgent-v0.6.0.apk",
            "sha256": "$SHA",
            "notes": "Health Agent V0.6：Google Drive API 直连。"
          }
          EOF

      - name: Commit
        run: |
          git config user.name "HealthAgent Publisher"
          git config user.email "healthagent-publisher@users.noreply.github.com"
          git add health-agent-updates/HealthAgent-v0.6.0.apk health-agent-updates/latest.json
          git commit -m "Publish HealthAgent v0.6"
          git push origin HEAD:health-agent-updates
