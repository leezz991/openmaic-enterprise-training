name: Publish HealthAgent v0.5

on:
  push:
    branches:
      - health-agent-updates
    paths:
      - ".github/workflows/publish-health-agent-v03.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4

      - name: Download signed HealthAgent artifact
        env:
          ARTIFACT_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-366c-8230-bc73-74b68e40703e/raw?se=2026-10-07T04%3A50%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=45ba07af-f9bc-5fd8-9665-ac19fee9864f&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T00%3A21%3A23Z&ske=2026-10-08T00%3A21%3A23Z&sks=b&skv=2026-02-06&sig=d8UNWWQl2ykbEkmrcM26H3nmMVfnCkskRc%2BIkds%2Blk0%3D'
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          mkdir -p extracted
          unzip -o artifact.zip -d extracted
          cp extracted/app-release.apk health-agent-updates/HealthAgent-v0.5.0.apk

      - name: Build update manifest
        run: |
          SHA=$(sha256sum health-agent-updates/HealthAgent-v0.5.0.apk | awk '{print $1}')
          cat > health-agent-updates/latest.json <<EOF
          {
            "versionCode": 5,
            "versionName": "0.5.0",
            "apkUrl": "https://raw.githubusercontent.com/leezz991/openmaic-enterprise-training/health-agent-updates/health-agent-updates/HealthAgent-v0.5.0.apk",
            "sha256": "$SHA",
            "notes": "Health Agent V0.5：新增云端同步文件夹选择；本地同步完成后自动排队上传 daily_health.csv 与 sync_status.json；上传任务要求联网并支持失败重试。"
          }
          EOF

      - name: Commit published update
        run: |
          git config user.name "HealthAgent Publisher"
          git config user.email "healthagent-publisher@users.noreply.github.com"
          git add health-agent-updates/HealthAgent-v0.5.0.apk health-agent-updates/latest.json
          git commit -m "Publish HealthAgent v0.5"
          git push origin HEAD:health-agent-updates
