name: Publish HealthAgent v0.8

on:
  push:
    branches:
      - health-agent-updates
    paths:
      - ".github/workflows/publish-health-agent-v03.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download V0.8 artifact
        env:
          ARTIFACT_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-09c4-820a-a02b-399639b34e41/raw?se=2026-10-07T14%3A39%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=143f1981-5764-51e7-bd30-ffb73a3137aa&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T00%3A23%3A27Z&ske=2026-10-08T00%3A23%3A27Z&sks=b&skv=2026-02-06&sig=80Iz2hQDaWd1kY7cv94sMiCL%2BxIx9JnS5c9mVe/B0q0%3D"
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip
          mv app-release.apk health-agent-updates/HealthAgent-v0.8.0.apk

      - name: Update manifest
        run: |
          SHA=$(sha256sum health-agent-updates/HealthAgent-v0.8.0.apk | awk '{print $1}')
          cat > health-agent-updates/latest.json <<EOF
          {
            "versionCode": 8,
            "versionName": "0.8.0",
            "apkUrl": "https://raw.githubusercontent.com/leezz991/openmaic-enterprise-training/health-agent-updates/health-agent-updates/HealthAgent-v0.8.0.apk",
            "sha256": "$SHA",
            "notes": "Health Agent V0.8：新增最近上传记录、连续失败状态、预计下次后台同步时间；首页卡片化美化；新增健康盾牌图标；保留 GitHub Private 最小化同步和本机 Keystore 凭据保护。"
          }
          EOF

      - name: Commit
        run: |
          git config user.name "HealthAgent Publisher"
          git config user.email "healthagent-publisher@users.noreply.github.com"
          git add health-agent-updates/HealthAgent-v0.8.0.apk health-agent-updates/latest.json
          git commit -m "Publish HealthAgent v0.8"
          git push origin HEAD:health-agent-updates
