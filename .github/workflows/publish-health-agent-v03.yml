name: Publish HealthAgent v0.7

on:
  push:
    branches:
      - health-agent-updates
    paths:
      - ".github/workflows/publish-health-agent-v03.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download V0.7 artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-cf60-8230-93f1-e501ec844f21/raw?se=2026-10-07T09%3A41%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=df70ab6f-d5ba-50c8-ac9b-789cd1adac38&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T00%3A43%3A19Z&ske=2026-10-08T00%3A43%3A19Z&sks=b&skv=2026-02-06&sig=2nn%2BHN1S1ejIPD1gV53nTTibc55415DwqmslWV3LMps%3D"
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -o artifact.zip
          mv app-release.apk health-agent-updates/HealthAgent-v0.7.0.apk

      - name: Update manifest
        run: |
          SHA=$(sha256sum health-agent-updates/HealthAgent-v0.7.0.apk | awk '{print $1}')
          cat > health-agent-updates/latest.json <<EOF
          {
            "versionCode": 7,
            "versionName": "0.7.0",
            "apkUrl": "https://raw.githubusercontent.com/leezz991/openmaic-enterprise-training/health-agent-updates/health-agent-updates/HealthAgent-v0.7.0.apk",
            "sha256": "$SHA",
            "notes": "Health Agent V0.7：改用 GitHub Private 私有同步；仅上传已完成日期的每日汇总；凭据使用 Android Keystore 加密；仅允许 Fine-grained token；每次上传前验证仓库仍为 Private。"
          }
          EOF

      - name: Commit
        run: |
          git config user.name "HealthAgent Publisher"
          git config user.email "healthagent-publisher@users.noreply.github.com"
          git add health-agent-updates/HealthAgent-v0.7.0.apk health-agent-updates/latest.json
          git commit -m "Publish HealthAgent v0.7"
          git push origin HEAD:health-agent-updates
