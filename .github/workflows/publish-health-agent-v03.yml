name: Repair HealthAgent v0.4 update channel

on:
  push:
    branches:
      - health-agent-updates
    paths:
      - ".github/workflows/publish-health-agent-v03.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4

      - name: Publish immutable v0.4 APK path
        run: |
          cp health-agent-updates/HealthAgent-latest.apk health-agent-updates/HealthAgent-v0.4.0.apk
          SHA=$(sha256sum health-agent-updates/HealthAgent-v0.4.0.apk | awk '{print $1}')
          cat > health-agent-updates/latest.json <<EOF
          {
            "versionCode": 4,
            "versionName": "0.4.0",
            "apkUrl": "https://raw.githubusercontent.com/leezz991/openmaic-enterprise-training/health-agent-updates/health-agent-updates/HealthAgent-v0.4.0.apk",
            "sha256": "$SHA",
            "notes": "Health Agent V0.4：新增本地健康数据库、每6小时后台同步、最近3天自动回补、daily_health.csv 与 sync_status.json、本地立即同步按钮。"
          }
          EOF

      - name: Commit repaired update channel
        run: |
          git config user.name "HealthAgent Publisher"
          git config user.email "healthagent-publisher@users.noreply.github.com"
          git add health-agent-updates/HealthAgent-v0.4.0.apk health-agent-updates/latest.json
          git commit -m "Repair HealthAgent v0.4 immutable APK path"
          git push origin HEAD:health-agent-updates
